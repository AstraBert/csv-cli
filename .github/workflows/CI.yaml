name: CI

on:
  pull_request:
    paths:
      - src/*.ts
      - package.json
      - eslint.config.ts
      - tsconfig.json

jobs:
  test:
    name: CI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Run eslint
        run: bun run lint

      - name: Run prettier
        run: bun run format

      - name: Run tests
        run: bun test
